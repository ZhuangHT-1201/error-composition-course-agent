<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
  <title id="title">Dual-engine course assistant architecture</title>
  <desc id="desc">A question flows through scope detection and bilingual retrieval, then either the local expert engine or optional DeepSeek enhancement produces an answer with source labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#e8efff"/>
    </linearGradient>
    <filter id="s" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1d3a9f" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1120" height="490" rx="34" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="55" y="62" fill="#ff6b4a" font-size="14" font-weight="700" letter-spacing="2">DUAL ENGINE</text>
    <text x="55" y="99" fill="#14214c" font-size="30" font-weight="700">Grounded answers, with an optional model boost</text>
  </g>
  <g filter="url(#s)">
    <rect x="48" y="156" width="190" height="190" rx="28" fill="#17224b"/>
    <rect x="272" y="156" width="212" height="190" rx="28" fill="#fff" stroke="#d8e1fb" stroke-width="2"/>
    <rect x="518" y="112" width="250" height="126" rx="28" fill="#e5fbfa" stroke="#8fe4e3" stroke-width="2"/>
    <rect x="518" y="264" width="250" height="126" rx="28" fill="#fff1cb" stroke="#ffd77c" stroke-width="2"/>
    <rect x="804" y="156" width="268" height="190" rx="28" fill="#fff" stroke="#d8e1fb" stroke-width="2"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="75" y="202" fill="#80eef3" font-size="13" font-weight="700" letter-spacing="1.5">01 / INPUT</text>
    <text x="75" y="240" fill="#fff" font-size="24" font-weight="700">Question</text>
    <text x="75" y="273" fill="#c8d3f3" font-size="15">Chinese or English</text>
    <text x="75" y="298" fill="#c8d3f3" font-size="15">concept, calculation,</text>
    <text x="75" y="320" fill="#c8d3f3" font-size="15">or boundary probe</text>

    <text x="298" y="202" fill="#ff6b4a" font-size="13" font-weight="700" letter-spacing="1.5">02 / ROUTE</text>
    <text x="298" y="240" fill="#17224b" font-size="23" font-weight="700">Scope + retrieval</text>
    <text x="298" y="273" fill="#60709b" font-size="15">Language and depth</text>
    <text x="298" y="298" fill="#60709b" font-size="15">Top knowledge cards</text>
    <text x="298" y="323" fill="#60709b" font-size="15">Condition checks</text>

    <text x="544" y="148" fill="#0c979f" font-size="13" font-weight="700" letter-spacing="1.5">LOCAL FIRST</text>
    <text x="544" y="180" fill="#17224b" font-size="22" font-weight="700">Course expert</text>
    <text x="544" y="208" fill="#31556c" font-size="14">22 bilingual cards + deterministic calculator</text>

    <text x="544" y="300" fill="#b96f00" font-size="13" font-weight="700" letter-spacing="1.5">OPTIONAL BOOST</text>
    <text x="544" y="332" fill="#17224b" font-size="22" font-weight="700">DeepSeek</text>
    <text x="544" y="360" fill="#5d5a4f" font-size="14">Uses the retrieved context when a key is supplied</text>

    <text x="830" y="202" fill="#ff6b4a" font-size="13" font-weight="700" letter-spacing="1.5">ANSWER</text>
    <text x="830" y="240" fill="#17224b" font-size="23" font-weight="700">Explain + verify</text>
    <text x="830" y="273" fill="#60709b" font-size="15">Conclusion and formula</text>
    <text x="830" y="298" fill="#60709b" font-size="15">Assumptions and example</text>
    <text x="830" y="323" fill="#60709b" font-size="15">GUM / JJF / VIM labels</text>
  </g>
  <g stroke="#7083b4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M238 251h25m-8-7 8 7-8 7"/>
    <path d="M484 251h24m-8-7 8 7-8 7"/>
    <path d="M768 188h20l10 63-10 63h-5 9m-8-7 8 7-8 7"/>
  </g>
</svg>
